<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Book</title>
</head>
<body>

<h2>Add New Book</h2>

<form th:action="@{/books/add}" th:object="${book}" method="post">

    <label>ID:</label>
    <input type="number" th:field="*{id}" /><br><br>

    <label>Title:</label>
    <input type="text" th:field="*{title}" />
    <span th:errors="*{title}" style="color:red"></span>
    <br><br>

    <label>Author:</label>
    <input type="text" th:field="*{author}" />
    <span th:errors="*{author}" style="color:red"></span>
    <br><br>

    <label>Price:</label>
    <input type="number" step="0.01" th:field="*{price}" />
    <span th:errors="*{price}" style="color:red"></span>
    <br><br>

    <button type="submit">Add Book</button>

</form>

<br>
<a th:href="@{/dashboard}">Back to Dashboard</a>

</body>
</html>
